# Serves the single-page app. Unknown paths get index.html so the router can answer them. The Content-Security-
# Policy and the rest of the deploy setup come with the overlays (frontend step F3).
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    # Built files carry a content hash in their name, so they never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
