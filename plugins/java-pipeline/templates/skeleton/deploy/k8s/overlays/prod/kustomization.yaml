# prod. Promote by changing newTag to a commit on main (CI pushed an image for it) in a reviewed PR;
# .github/scripts/check-deploy.sh checks the change. "unreleased" means nothing has been promoted yet.
#   kubectl apply -k deploy/k8s/overlays/prod
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: app-skeleton-prod
resources:
  - ../../base
replicas:
  - name: app-skeleton
    count: 3
images:
  - name: ghcr.io/nabiabdallah/app-skeleton
    newTag: unreleased
