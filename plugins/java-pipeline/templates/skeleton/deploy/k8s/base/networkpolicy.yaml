# Default deny in both directions, then allow only what the service needs (claude-factory ADR 0012).
# Enforced only if the cluster's network plugin supports NetworkPolicy.
# - In: the http port, from namespaces labelled claude-factory/ingress=true (label your ingress controller's
#   namespace). Kubelet health probes come from the node and are not subject to this policy.
# - Out: DNS in kube-system; TCP 443 (identity provider) and 5432 (Postgres) to any address. Narrow these to
#   your issuer's and database's addresses once they are known.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-skeleton
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: app-skeleton
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              claude-factory/ingress: "true"
      ports:
        - port: http
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 443
          protocol: TCP
        - port: 5432
          protocol: TCP
