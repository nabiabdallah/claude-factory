name: Post-deploy

# The result of a rollout (claude-factory ADR 0034). Flux, in the cluster, reports each rollout as a commit status
# on the commit it applied (`flux/<service>-<environment>`): green once the new pods are ready, red when they
# aren't within its timeout. A red one opens the issue "Deploy failed: <context>"; the next green one closes it.
# GitHub runs this from the default branch for every commit status; other contexts end at the job's `if`.
on:
  status:

permissions:
  contents: read

# One at a time per context, in order: two reports of one rollout must not open two issues.
concurrency:
  group: post-deploy-${{ github.event.context }}
  cancel-in-progress: false

jobs:
  report:
    if: >-
      github.event.state != 'pending' &&
      (startsWith(github.event.context, 'flux/') || startsWith(github.event.context, 'kustomization/'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write # open, comment on and close the "Deploy failed" issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The status' text comes from outside: it reaches the script through the environment, never a command line.
      - name: Open, update or close the "Deploy failed" issue
        run: .github/scripts/deploy.sh report
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_CONTEXT: ${{ github.event.context }}
          DEPLOY_STATE: ${{ github.event.state }}
          DEPLOY_SHA: ${{ github.event.sha }}
          DEPLOY_DESCRIPTION: ${{ github.event.description }}
