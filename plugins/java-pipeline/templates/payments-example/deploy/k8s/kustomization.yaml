# Kustomize base (claude-factory ADR 0007). Deploy a version by changing newTag (CI pushes <sha> and main):
#   kubectl apply -k deploy/k8s
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
labels:
  - pairs:
      app.kubernetes.io/name: payments-starter
    includeSelectors: true
images:
  - name: ghcr.io/nabiabdallah/payments-starter
    newTag: main
