# staging. Promote by changing newTag to a commit on main (CI pushed an image for it) in a reviewed PR;
# .github/scripts/check-deploy.sh checks the change. "unreleased" means nothing has been promoted yet.
#   kubectl apply -k deploy/k8s/overlays/staging
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: payments-starter-staging
resources:
  - ../../base
replicas:
  - name: payments-starter
    count: 1
images:
  - name: ghcr.io/nabiabdallah/payments-starter
    newTag: unreleased
