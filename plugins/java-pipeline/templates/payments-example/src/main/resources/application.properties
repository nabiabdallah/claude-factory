spring.application.name=payments-starter

# Kubernetes probes: only /actuator/health (+ /liveness, /readiness) is exposed, without internals.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# JSON logs (ECS) for log collectors. Plain text locally: run with the `local` profile.
logging.structured.format.console=ecs

# Let in-flight requests finish when the pod is stopped.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
