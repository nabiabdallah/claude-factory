
# OAuth2 resource server (claude-factory ADR 0008). Tokens must come from AUTH_ISSUER_URI (signature checked
# against its published keys) and name this service in "aud". Without AUTH_ISSUER_URI the service refuses
# to start instead of running unprotected, and so does an issuer not on https (plain http only to localhost). Tests use a throwaway key instead (support/TestJwtInitializer).
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.audiences=${AUTH_AUDIENCE:__SVC__}
