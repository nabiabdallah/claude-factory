
# Postgres. Override with DB_URL / DB_USERNAME / DB_PASSWORD; the defaults match compose.yaml (local only).
# Tests don't use these: every Spring test context gets an embedded Postgres (support/EmbeddedPostgresInitializer).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/__DB__}
spring.datasource.username=${DB_USERNAME:__DB__}
spring.datasource.password=${DB_PASSWORD:}
# Waiters on a row lock fail after 5s (generic 500; safe to retry) instead of hanging. Also applies to Flyway.
spring.datasource.hikari.connection-init-sql=SET lock_timeout = '5s'
# Don't let the driver copy server error detail ("Failing row contains (<id>, ...)") into exception
# messages: errors get logged, and logs must not contain identifiers.
spring.datasource.hikari.data-source-properties.logServerErrorDetail=false
