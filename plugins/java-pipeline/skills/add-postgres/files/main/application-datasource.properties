
# Postgres. Override with DB_URL / DB_USERNAME / DB_PASSWORD; the defaults match compose.yaml (local only).
# Tests don't use these: every Spring test context gets an embedded Postgres (support/EmbeddedPostgresInitializer).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/__DB__}
spring.datasource.username=${DB_USERNAME:__DB__}
spring.datasource.password=${DB_PASSWORD:}
