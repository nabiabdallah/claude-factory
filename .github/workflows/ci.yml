name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  template:
    name: Template builds and new-project works
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install factory-parent locally (templates build against this commit's parent)
        working-directory: parents/factory-parent
        run: ./mvnw -B install

      - name: Verify the skeleton template
        working-directory: plugins/java-pipeline/templates/skeleton
        run: ./mvnw -B verify

      - name: Verify the payments-example template
        working-directory: plugins/java-pipeline/templates/payments-example
        run: ./mvnw -B verify

      - name: Smoke-test new-project (both templates, same/nested/different packages)
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@users.noreply.github.com"
          script=plugins/java-pipeline/skills/new-project/scripts/new-project.sh
          out="$RUNNER_TEMP/projects"
          "$script" --list
          "$script" ci-skeleton com.acme.customers "$out"
          "$script" ci-skeleton-nested com.example.app.core "$out"
          "$script" --template payments-example ci-payments-same com.example.payments "$out"
          "$script" --template payments-example ci-payments-other com.acme.ledger.core "$out"
