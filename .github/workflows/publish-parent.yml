name: Publish factory-parent

# Release: bump <version> in parents/factory-parent/pom.xml and merge. release-tag.yml then creates the tag
# factory-parent-vX.Y.Z on the merge commit (factory ADR 0026), which starts this workflow. By hand, if needed:
#   git tag factory-parent-v1.0.0 && git push origin factory-parent-v1.0.0
on:
  push:
    tags: ['factory-parent-v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: parents/factory-parent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username-env-var: GITHUB_ACTOR
          server-password-env-var: GITHUB_TOKEN

      - name: Tag must match the pom version
        run: |
          pom_version=$(./mvnw -q -B help:evaluate -Dexpression=project.version -DforceStdout)
          tag_version="${GITHUB_REF_NAME#factory-parent-v}"
          echo "pom=$pom_version tag=$tag_version"
          [ "$pom_version" = "$tag_version" ] || { echo "::error::tag $GITHUB_REF_NAME does not match pom version $pom_version"; exit 1; }

      - name: Changelog has this version (factory ADR 0015)
        working-directory: ${{ github.workspace }}
        run: ci/check-release-notes.sh --tag "$GITHUB_REF_NAME"

      - name: Deploy to GitHub Packages
        run: ./mvnw -B deploy
        env:
          GITHUB_TOKEN: ${{ github.token }}
